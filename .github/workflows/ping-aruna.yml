name: Scheduled Pings — Aruna Screeners

on:
  schedule:
    # Run at UTC hours: 00, 06, 11, 14
    - cron: "0 0 * * *"   # 00 UTC
    - cron: "0 6 * * *"   # 06 UTC
    - cron: "0 11 * * *"  # 11 UTC
    - cron: "0 14 * * *"  # 14 UTC
  workflow_dispatch: {}   # manual trigger

jobs:
  ping_endpoints:
    runs-on: ubuntu-latest
    steps:
      - name: Ping endpoints according to UTC hour
        env:
          CRYPTO_URL: "https://aruna.ramadhanep.com/api/screeners/crypto"
          US_URL:    "https://aruna.ramadhanep.com/api/screeners/us"
          IDX_URL:   "https://aruna.ramadhanep.com/api/screeners/idx"
        run: |
          set -euo pipefail
          HOUR=$(date -u +%H)
          echo "UTC hour: $HOUR"

          http_get() {
            url="$1"
            echo "→ GET $url"
            # try up to 3 times with small backoff
            for i in 1 2 3; do
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url") || status=000
              echo "  attempt $i: HTTP $status"
              if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
                echo "  success"
                return 0
              fi
              sleep 2
            done
            echo "  failed after 3 attempts"
            return 1
          }

          fails=0

          case "$HOUR" in
            "00")
              # At 00 UTC: crypto (1x), us (one of 2x), idx (one of 3x)
              http_get "$CRYPTO_URL" || fails=$((fails+1))
              http_get "$US_URL"    || fails=$((fails+1))
              http_get "$IDX_URL"   || fails=$((fails+1))
              ;;
            "06")
              # At 06 UTC: idx
              http_get "$IDX_URL"   || fails=$((fails+1))
              ;;
            "11")
              # At 11 UTC: idx
              http_get "$IDX_URL"   || fails=$((fails+1))
              ;;
            "14")
              # At 14 UTC: us (second hit)
              http_get "$US_URL"    || fails=$((fails+1))
              ;;
            *)
              echo "No scheduled actions for this UTC hour."
              ;;
          esac

          if [ "$fails" -gt 0 ]; then
            echo "$fails request(s) failed — marking job as failed."
            exit 1
          fi

          echo "All scheduled requests finished."