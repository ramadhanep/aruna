name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          APP_URL: https://aruna.example.com
          SECURE_PAYLOAD_KEY: ci-placeholder-key
          CRON_SECRET: ci-placeholder-secret
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          APP_URL: https://aruna.example.com
          SECURE_PAYLOAD_KEY: ci-placeholder-key
          CRON_SECRET: ci-placeholder-secret
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          SECURE_PAYLOAD_KEY: ci-placeholder-key
